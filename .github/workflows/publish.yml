name: Publish to PyPI

# Publishes to PyPI on a GitHub Release via trusted publishing (OIDC) — no API
# token or password is stored. The PyPI project must have a trusted publisher
# (or pending publisher) registered for this repository, the workflow filename
# `publish.yml`, and the `pypi` environment. Lint/test live in ci.yml.
#
# Every action here is pinned to an exact version, never a floating major.
# This workflow runs only on a release, so a pin that stops resolving is not
# discovered until the moment you are trying to ship: the v0.2.0 release failed
# at job setup because `astral-sh/setup-uv@v8` had no floating `v8` tag, while
# ci.yml's exact `v8.2.0` had been green all along. Bump these deliberately.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Install uv
        # Same exact version ci.yml uses — keep the two in step.
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing (OIDC)
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # Deliberately NOT pinned to an exact version, unlike everything above.
        # PyPA maintains `release/v1` as the supported moving target and ships
        # trusted-publishing/OIDC security fixes to it; pinning would opt this
        # step out of those. This is the one action where a floating ref is the
        # upstream recommendation, not an oversight.
        uses: pypa/gh-action-pypi-publish@release/v1
